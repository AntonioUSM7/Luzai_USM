services:
  backend:
    build: ./backend
    container_name: luzai_smartguard_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app:z
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - OLLAMA_LLM_MODEL=${OLLAMA_LLM_MODEL:-qwen2.5:3b}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-8192}
      - RAG_AUTO_REINDEX=${RAG_AUTO_REINDEX:-1}
      - RAG_MIN_SCORE=${RAG_MIN_SCORE:-0.25}
      - RAG_OFFTOPIC_SCORE=${RAG_OFFTOPIC_SCORE:-0.65}
      - HOME=/tmp
      - ANONYMIZED_TELEMETRY=False
      - CHROMA_TELEMETRY_ENABLED=False
    user: "${UID:-1000}:${GID:-1000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: luzai_smartguard_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app:z
      - /app/node_modules
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    restart: unless-stopped
